<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>称骨命理报告</title>
<style>
  @page { size: A4; margin: 20mm; }
  body { font-family: "SimSun","宋体",serif; color: #333; line-height: 1.8; max-width: 700px; margin: 0 auto; padding: 20px; }
  .cover { text-align: center; padding: 60px 0 40px; border-bottom: 2px solid #8a6d4b; margin-bottom: 30px; }
  .cover h1 { font-size: 32px; color: #5a3d2b; margin-bottom: 10px; letter-spacing: 8px; }
  .cover .sub { font-size: 14px; color: #8a6d4b; }
  .cover .name { font-size: 24px; margin-top: 30px; color: #5a3d2b; }
  .section { margin-bottom: 20px; }
  .section h2 { font-size: 18px; color: #5a3d2b; border-left: 4px solid #8a6d4b; padding-left: 10px; margin-bottom: 10px; }
  .info-row { display: flex; flex-wrap: wrap; gap: 15px; font-size: 14px; margin-bottom: 8px; }
  .info-row span { background: #f5f0e6; padding: 4px 12px; border-radius: 4px; }
  .weight-box { background: #faf6ee; border: 1px solid #d4c4a8; border-radius: 8px; padding: 15px; margin: 10px 0; }
  .weight-box .big { font-size: 28px; color: #8a6d4b; font-weight: bold; }
  .song { white-space: pre-wrap; font-size: 15px; background: #faf6ee; padding: 15px; border-radius: 8px; line-height: 2; }
  .wuxing-bar { display: flex; align-items: center; margin: 4px 0; font-size: 13px; }
  .wuxing-bar .label { width: 30px; }
  .wuxing-bar .bar { flex: 1; background: #eee; height: 16px; border-radius: 3px; margin: 0 8px; }
  .wuxing-bar .fill { height: 100%; background: #8a6d4b; border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  th, td { border: 1px solid #d4c4a8; padding: 8px; text-align: center; }
  th { background: #f5f0e6; color: #5a3d2b; }
  .tips { font-size: 13px; color: #666; }
  .tips li { margin-bottom: 5px; }
  .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #d4c4a8; font-size: 12px; color: #999; }
  .no-print { text-align: center; margin-bottom: 20px; }
  .no-print button { background: #8a6d4b; color: #fff; border: none; padding: 10px 30px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  @media print { .no-print { display: none; } body { padding: 0; } }
</style>
</head>
<body>

<div class="no-print">
  <button onclick="window.print()">打印 / 保存为PDF</button>
  <button onclick="history.back()" style="background:#999;margin-left:10px">返回</button>
</div>

<div id="report-content">
  <div class="cover">
    <h1>称骨命理报告</h1>
    <div class="sub">CHENGGU FORTUNE REPORT</div>
    <div class="name" id="r-name">命主</div>
  </div>
  <div id="r-body">加载中...</div>
</div>

<div class="footer">
  本报告由称骨算命系统生成 · 仅供娱乐参考，不构成任何决策依据
</div>

<script>
const params = new URLSearchParams(window.location.search);
const type = params.get('type') || 'deep';
const name = params.get('name') || '命主';
const gender = params.get('gender') || '男';
const year = +params.get('year');
const month = +params.get('month');
const day = +params.get('day');
const hour = +params.get('hour') || 12;

document.getElementById('r-name').textContent = name + ' · ' + gender + '命';

async function api(url, method='GET', body=null) {
  const opt = {method, headers: {'Content-Type':'application/json'}, credentials:'same-origin'};
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '请求失败');
  return d;
}

function wuxingBars(count) {
  let html = '';
  for (const w of ['金','木','水','火','土']) {
    const c = count[w] || 0;
    html += `<div class="wuxing-bar"><span class="label">${w}</span><div class="bar"><div class="fill" style="width:${c*12.5}%"></div></div><span>${c}</span></div>`;
  }
  return html;
}

(async () => {
  try {
    if (type === 'deep') {
      const r = await api('/api/deep', 'POST', {name, gender, year, month, day, hour});
      let html = `
<div class="section"><h2>基本信息</h2>
<div class="info-row"><span>公历：${r.solar}</span><span>农历：${r.lunar}</span><span>性别：${r.gender}命</span></div>
<div class="info-row"><span>四柱：${r.pillars.join(' ')}</span></div></div>
<div class="section"><h2>骨重</h2>
<div class="weight-box"><span class="big">${r.standard_text}</span>（标准称骨法） / ${r.palace_text}（宫位法） · ${r.level}</div></div>
<div class="section"><h2>五行与日主</h2><p>日主：${r.day_master}（${r.day_master_wuxing}）</p>${wuxingBars(r.wuxing_count)}</div>
<div class="section"><h2>性格特征</h2><p>${r.personality}</p></div>
<div class="section"><h2>事业财运</h2><p>${r.career}</p></div>
<div class="section"><h2>婚姻感情</h2><p>${r.marriage}</p></div>
<div class="section"><h2>健康注意</h2><p>${r.health}</p></div>
<div class="section"><h2>大运走势</h2>${r.dayun.map(d=>`<p><b>${d[0]}</b>：${d[1]}</p>`).join('')}</div>
<div class="section"><h2>称骨歌</h2><div class="song">${r.song}</div></div>`;
      document.getElementById('r-body').innerHTML = html;
    } else if (type === 'marriage') {
      const n2 = params.get('name2') || '乙方';
      const y2 = +params.get('year2'), m2 = +params.get('month2'), d2 = +params.get('day2'), h2 = +params.get('hour2')||12;
      const r = await api('/api/marriage', 'POST', {
        p1:{name, year, month, day, hour}, p2:{name:n2, year:y2, month:m2, day:d2, hour:h2}
      });
      document.querySelector('.cover .name').textContent = r.name1 + ' 与 ' + r.name2 + ' 合婚报告';
      let html = `
<div class="section"><h2>合婚评分</h2>
<div class="weight-box"><span class="big">${r.score} 分</span> · ${r.level}</div></div>
<div class="section"><h2>生肖配对（${r.shengxiao_score}分）</h2><p>${r.shengxiao}</p></div>
<div class="section"><h2>五行互补（${r.wuxing_score}分）</h2><p>${r.wuxing}</p>
<p>两人五行合计：金${r.wuxing_combined.金} 木${r.wuxing_combined.木} 水${r.wuxing_combined.水} 火${r.wuxing_combined.火} 土${r.wuxing_combined.土}</p></div>
<div class="section"><h2>日柱关系（${r.rizhu_score}分）</h2><p>${r.rizhu}</p></div>
<div class="section"><h2>骨重匹配（${r.guzhong_score}分）</h2><p>${r.guzhong}</p></div>
<div class="section"><h2>综合建议</h2><p>${r.advice}</p></div>
<div class="section"><h2>四柱</h2><p>${r.name1}：${r.p1_pillars.join(' ')}</p><p>${r.name2}：${r.p2_pillars.join(' ')}</p></div>`;
      document.getElementById('r-body').innerHTML = html;
    }
  } catch(e) {
    document.getElementById('r-body').innerHTML = '<p style="color:red">加载失败：' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
