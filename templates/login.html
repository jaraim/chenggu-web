<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>称骨算命 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #2c1810 0%, #5a3d2b 50%, #8a6d4b 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: #fffdf7;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center; color: #5a3d2b; font-size: 28px;
    margin-bottom: 6px; letter-spacing: 4px;
  }
  .subtitle {
    text-align: center; color: #8a6d4b; font-size: 13px;
    margin-bottom: 28px;
  }
  .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #e8ddd0; }
  .tab {
    flex: 1; text-align: center; padding: 10px; cursor: pointer;
    font-size: 15px; color: #8a6d4b; border-bottom: 3px solid transparent;
    margin-bottom: -2px; transition: all 0.2s;
  }
  .tab.active { color: #5a3d2b; border-bottom-color: #b08968; font-weight: bold; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #5a3d2b; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border: 1px solid #d4c4b0;
    border-radius: 8px; font-size: 15px; background: #fff;
    outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: #b08968; }
  button {
    width: 100%; padding: 13px; background: #b08968; color: #fff;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 8px; transition: background 0.2s;
  }
  button:hover { background: #9a7556; }
  .msg {
    text-align: center; font-size: 13px; margin-top: 14px;
    min-height: 20px;
  }
  .msg.error { color: #c0392b; }
  .msg.success { color: #27ae60; }
  .footer {
    text-align: center; margin-top: 24px; font-size: 12px; color: #aaa;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>称骨算命</h1>
  <p class="subtitle">传统命理 · 八字称骨 · 取名合婚</p>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">登录</div>
    <div class="tab" onclick="switchTab('register')">注册</div>
  </div>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码（至少6位）" autocomplete="current-password">
  </div>
  <button onclick="submit()">登 录</button>
  <div class="msg" id="msg"></div>
  <p class="footer">本站内容仅供传统文化娱乐参考</p>
</div>
<script>
let mode = 'login';
function switchTab(t) {
  mode = t;
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && t === 'login') || (i === 1 && t === 'register'));
  });
  document.querySelector('button').textContent = t === 'login' ? '登 录' : '注 册';
  document.getElementById('msg').textContent = '';
}
async function submit() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!username || !password) { msg.className = 'msg error'; msg.textContent = '请填写用户名和密码'; return; }
  try {
    const res = await fetch('/api/' + mode, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { msg.className = 'msg error'; msg.textContent = data.error || '操作失败'; return; }
    if (mode === 'register') {
      msg.className = 'msg success'; msg.textContent = '注册成功，请登录';
      switchTab('login');
    } else {
      location.href = '/';
    }
  } catch(e) {
    msg.className = 'msg error'; msg.textContent = '网络错误，请重试';
  }
}
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
</script>
</body>
</html>
